<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日常事務管理站</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --pink:#ff8fab; --pink-light:#ffe3ec; --mint:#8fd9c4; --mint-light:#e3fbf3;
    --lav:#b8a9ff; --lav-light:#ece7ff;
    --gray:#6b6b6b; --bg:#fafafa; --card:#ffffff; --shadow:0 2px 10px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;}
  body{font-family:"PingFang TC","Microsoft JhengHei",sans-serif; background:var(--bg); margin:0; color:#333;}
  header{background:linear-gradient(135deg,var(--pink),#ffb3c6); color:white; padding:20px; text-align:center;}
  header h1{margin:0; font-size:20px;}
  .container{max-width:900px; margin:0 auto; padding:20px;}

  /* 登入畫面 */
  #authScreen{max-width:360px; margin:60px auto; background:var(--card); border-radius:14px; padding:28px; box-shadow:var(--shadow);}
  #authScreen h2{margin-top:0; font-size:18px; text-align:center;}
  #authScreen input{width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px; font-size:14px;}
  #authScreen button{width:100%; padding:10px; border:none; border-radius:8px; background:var(--pink); color:white; font-size:14px; cursor:pointer; margin-top:4px;}
  #authScreen .switch-link{text-align:center; font-size:12px; color:var(--gray); margin-top:12px; cursor:pointer; text-decoration:underline;}
  #authMsg{font-size:12px; color:#c0392b; text-align:center; min-height:16px;}

  /* Tabs */
  .tabs{display:flex; gap:8px; margin-bottom:16px;}
  .tab-btn{flex:1; padding:10px; border:none; border-radius:10px; background:#eee; cursor:pointer; font-size:14px; font-weight:600;}
  .tab-btn.active{background:var(--pink); color:white;}

  .category-card{background:var(--card); border-radius:14px; box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden;}
  .category-header{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; cursor:pointer;}
  .category-title{display:flex; align-items:center; gap:10px; font-size:16px; font-weight:600;}
  .category-icon{font-size:22px;}
  .category-meta{font-size:12px; color:var(--gray);}
  .chevron{transition:transform 0.2s; font-size:14px; color:var(--gray);}
  .category-card.open .chevron{transform:rotate(90deg);}
  .category-body{max-height:0; overflow:hidden; transition:max-height 0.25s ease; border-top:1px solid #eee;}
  .category-card.open .category-body{max-height:3000px;}
  .body-inner{padding:16px 20px;}
  .add-btn{background:var(--pink); color:white; border:none; border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; margin-bottom:12px;}
  .add-btn.mint{background:var(--mint);} .add-btn.lav{background:var(--lav);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th, td{padding:8px 6px; text-align:left; border-bottom:1px solid #f0f0f0;}
  th{color:var(--gray); font-weight:600; font-size:12px;}
  input, select{width:100%; padding:5px 6px; border:1px solid #ddd; border-radius:6px; font-size:13px;}
  .icon-btn{background:none; border:none; cursor:pointer; font-size:14px; padding:2px 4px;}
  .status-tag{display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px;}
  .status-ok{background:var(--mint-light); color:#2a7a5f;} .status-warn{background:#fff3cd; color:#8a6d00;} .status-due{background:#ffe0e0; color:#c0392b;}
  .summary-bar{display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap;}
  .summary-item{background:var(--pink-light); border-radius:10px; padding:8px 14px; font-size:12px;}
  .summary-item.lav{background:var(--lav-light);}
  .summary-item b{display:block; font-size:16px; margin-top:2px;}
  .empty-hint{color:#aaa; font-size:13px; padding:10px 0;}
  .toolbar{display:flex; justify-content:space-between; margin-bottom:16px; gap:8px; flex-wrap:wrap; align-items:center;}
  .small-btn{background:#f0f0f0; border:none; border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer;}
  .telegram-banner{background:var(--lav-light); border-radius:10px; padding:12px 16px; margin-bottom:16px; font-size:13px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
  .telegram-banner button{background:var(--lav); color:white; border:none; border-radius:8px; padding:6px 14px; font-size:12px; cursor:pointer;}
  .household-box{background:var(--card); border-radius:14px; padding:16px 20px; margin-bottom:16px; box-shadow:var(--shadow); font-size:13px;}
  .household-box input{margin-bottom:8px;}
  .invite-link-box{background:#f5f5f5; padding:8px; border-radius:8px; font-size:12px; word-break:break-all; margin-top:8px;}
  #userBar{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--gray); margin-bottom:10px;}
  .add-category-card{border:2px dashed #ddd; background:transparent; box-shadow:none; cursor:pointer;}
  .add-category-card:hover{border-color:var(--pink); background:var(--pink-light);}
  .modal-overlay{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); align-items:center; justify-content:center; z-index:100;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:white; border-radius:14px; padding:24px; width:320px; box-shadow:0 8px 30px rgba(0,0,0,0.2);}
  .modal-box h3{margin:0 0 14px; font-size:16px;}
  .modal-actions{display:flex; gap:8px; margin-top:18px; justify-content:flex-end;}
  .modal-actions button{border:none; border-radius:8px; padding:8px 16px; font-size:13px; cursor:pointer;}
  .btn-cancel{background:#eee;} .btn-confirm{background:var(--pink); color:white;}
  .emoji-picker{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;}
  .emoji-picker span{font-size:20px; padding:4px 6px; border-radius:8px; cursor:pointer; border:2px solid transparent;}
  .emoji-picker span.selected{border-color:var(--pink); background:var(--pink-light);}
  #appScreen{display:none;}
</style>
</head>
<body>

<header><h1>🏠 日常事務管理站</h1></header>

<!-- 登入/註冊畫面 -->
<div id="authScreen">
  <h2 id="authTitle">登入</h2>
  <input type="email" id="authEmail" placeholder="Email">
  <input type="password" id="authPassword" placeholder="密碼">
  <button id="authSubmitBtn" onclick="handleAuthSubmit()">登入</button>
  <div id="authMsg"></div>
  <div class="switch-link" onclick="toggleAuthMode()">還沒有帳號？點此註冊</div>
</div>

<!-- 主畫面 -->
<div class="container" id="appScreen">
  <div id="userBar">
    <span id="userEmailLabel"></span>
    <span class="small-btn" onclick="handleLogout()" style="cursor:pointer;">登出</span>
  </div>

  <div class="telegram-banner" id="telegramBanner">
    <span>📲 尚未綁定 Telegram 提醒</span>
    <button onclick="openTelegramOptIn()">同意接收提醒</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabPersonal" onclick="switchTab('personal')">👤 我的專屬</button>
    <button class="tab-btn" id="tabShared" onclick="switchTab('shared')">👨‍👩‍👧 家庭共享</button>
  </div>

  <div class="household-box" id="householdBox" style="display:none;">
    <div id="householdInfo"></div>
  </div>

  <div class="toolbar">
    <div>
      <button class="small-btn" onclick="exportBackup()">💾 匯出備份</button>
    </div>
    <div style="font-size:12px;color:#999;" id="module-count"></div>
  </div>

  <div class="category-card" id="cat-subscription">
    <div class="category-header" onclick="toggleCategory('cat-subscription')">
      <div class="category-title"><span class="category-icon">💳</span> 訂閱與固定支出管理</div>
      <div style="display:flex;align-items:center;gap:10px;"><span class="category-meta" id="sub-meta"></span><span class="chevron">▶</span></div>
    </div>
    <div class="category-body"><div class="body-inner">
      <div class="summary-bar" id="sub-summary"></div>
      <button class="add-btn" onclick="addSubscription()">➕ 新增訂閱/固定支出</button>
      <table><thead><tr><th>名稱</th><th>金額</th><th>幣種</th><th>週期</th><th>下次扣款日</th><th>提醒(天)</th><th>狀態</th><th></th></tr></thead>
      <tbody id="sub-tbody"></tbody></table>
      <div class="empty-hint" id="sub-empty" style="display:none;">尚未新增任何訂閱項目</div>
    </div></div>
  </div>

  <div class="category-card" id="cat-cat">
    <div class="category-header" onclick="toggleCategory('cat-cat')">
      <div class="category-title"><span class="category-icon">🐱</span> 貓咪開支記錄</div>
      <div style="display:flex;align-items:center;gap:10px;"><span class="category-meta" id="cat-meta"></span><span class="chevron">▶</span></div>
    </div>
    <div class="category-body"><div class="body-inner">
      <div class="summary-bar" id="cat-summary"></div>
      <button class="add-btn mint" onclick="addCatExpense()">➕ 新增開支記錄</button>
      <table><thead><tr><th>日期</th><th>項目</th><th>類別</th><th>金額</th><th>備註</th><th></th></tr></thead>
      <tbody id="cat-tbody"></tbody></table>
      <div class="empty-hint" id="cat-empty" style="display:none;">尚未新增任何開支記錄</div>
    </div></div>
  </div>

  <div id="custom-categories-container"></div>

  <div class="category-card add-category-card" onclick="openAddCategoryModal()">
    <div class="category-header">
      <div class="category-title"><span class="category-icon">➕</span> 新增分類</div>
      <div class="category-meta">建立新的日常事務模塊</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addCategoryModal">
  <div class="modal-box">
    <h3>建立新分類模塊</h3>
    <label style="font-size:12px;color:var(--gray);">分類名稱</label>
    <input type="text" id="newCatName" placeholder="例如：植物照護">
    <label style="font-size:12px;color:var(--gray);">選擇 icon</label>
    <div class="emoji-picker" id="emojiPicker">
      <span data-emoji="🌱">🌱</span><span data-emoji="📈">📈</span><span data-emoji="✅">✅</span>
      <span data-emoji="🏠">🏠</span><span data-emoji="🚗">🚗</span><span data-emoji="💊">💊</span>
      <span data-emoji="🎁">🎁</span><span data-emoji="📚">📚</span><span data-emoji="✈️">✈️</span><span data-emoji="🧾">🧾</span>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddCategoryModal()">取消</button>
      <button class="btn-confirm" onclick="confirmAddCategory()">建立</button>
    </div>
  </div>
</div>

<script>
let currentUser = null;
let currentTab = 'personal';
let currentHouseholdId = null;
let selectedEmoji = '🌱';
let isRegisterMode = false;

/* ---------- Auth ---------- */
function toggleAuthMode(){
  isRegisterMode = !isRegisterMode;
  document.getElementById('authTitle').textContent = isRegisterMode ? '註冊' : '登入';
  document.getElementById('authSubmitBtn').textContent = isRegisterMode ? '註冊' : '登入';
  document.querySelector('.switch-link').textContent = isRegisterMode ? '已經有帳號？點此登入' : '還沒有帳號？點此註冊';
}

async function handleAuthSubmit(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const msgEl = document.getElementById('authMsg');
  msgEl.textContent = '';
  if(!email || !password){ msgEl.textContent = '請輸入 Email 和密碼'; return; }

  if(isRegisterMode){
    const { data, error } = await sb.auth.signUp({ email, password });
    if(error){ msgEl.textContent = error.message; return; }
    if(data.user){
      await sb.from('user_settings').upsert({ user_id: data.user.id });
    }
    msgEl.style.color = '#2a7a5f';
    msgEl.textContent = '註冊成功！請檢查信箱完成驗證後登入。';
  } else {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ msgEl.textContent = error.message; return; }
    onLoginSuccess(data.user);
  }
}

async function handleLogout(){
  await sb.auth.signOut();
  location.reload();
}

async function onLoginSuccess(user){
  currentUser = user;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('userEmailLabel').textContent = user.email;
  await checkTelegramStatus();
  await loadHousehold();
  await renderAll();
}

async function checkTelegramStatus(){
  const { data } = await sb.from('user_settings').select('telegram_opted_in').eq('user_id', currentUser.id).maybeSingle();
  const banner = document.getElementById('telegramBanner');
  if(data && data.telegram_opted_in){
    banner.innerHTML = '<span>✅ 已綁定 Telegram 提醒</span>';
  }
}

function openTelegramOptIn(){
  const url = `https://t.me/${TELEGRAM_BOT_USERNAME}?start=${currentUser.id}`;
  window.open(url, '_blank');
}

/* ---------- 家庭群組 ---------- */
async function loadHousehold(){
  const { data: memberRows } = await sb.from('household_members').select('household_id, households(name)').eq('user_id', currentUser.id).limit(1);
  const box = document.getElementById('householdBox');
  if(memberRows && memberRows.length > 0){
    currentHouseholdId = memberRows[0].household_id;
    box.style.display = 'block';
    box.querySelector ? null : null;
    document.getElementById('householdInfo').innerHTML = `
      <b>家庭群組：</b>${memberRows[0].households?.name || '未命名'}
      <button class="small-btn" style="margin-left:10px;" onclick="generateInvite()">➕ 邀請家人</button>
      <div id="inviteResult"></div>
    `;
  } else {
    box.style.display = 'block';
    document.getElementById('householdInfo').innerHTML = `
      <b>尚未加入任何家庭群組</b><br>
      <input type="text" id="newHouseholdName" placeholder="家庭群組名稱，例如：李氏家庭">
      <button class="small-btn" onclick="createHousehold()">建立家庭群組</button>
      <div style="margin-top:8px;">或輸入邀請碼加入：</div>
      <input type="text" id="joinInviteCode" placeholder="邀請碼">
      <button class="small-btn" onclick="joinHousehold()">加入</button>
    `;
  }
}

async function createHousehold(){
  const name = document.getElementById('newHouseholdName').value.trim();
  if(!name) return alert('請輸入群組名稱');
  const { data: hh, error } = await sb.from('households').insert({ name, created_by: currentUser.id }).select().single();
  if(error) return alert('建立失敗：' + error.message);
  await sb.from('household_members').insert({ household_id: hh.id, user_id: currentUser.id, role: 'owner' });
  await loadHousehold();
}

async function joinHousehold(){
  const code = document.getElementById('joinInviteCode').value.trim();
  if(!code) return alert('請輸入邀請碼');
  const { data: invite, error } = await sb.from('household_invites').select('*').eq('invite_code', code).is('used_by', null).maybeSingle();
  if(error || !invite) return alert('邀請碼無效或已被使用');
  await sb.from('household_members').insert({ household_id: invite.household_id, user_id: currentUser.id });
  await sb.from('household_invites').update({ used_by: currentUser.id }).eq('id', invite.id);
  await loadHousehold();
}

async function generateInvite(){
  const { data, error } = await sb.from('household_invites').insert({ household_id: currentHouseholdId, created_by: currentUser.id }).select().single();
  if(error) return alert('生成失敗：' + error.message);
  document.getElementById('inviteResult').innerHTML = `<div class="invite-link-box">邀請碼：<b>${data.invite_code}</b>（7天內有效，把這串碼告訴家人，讓他們登入後在「加入群組」輸入）</div>`;
}

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tabPersonal').classList.toggle('active', tab==='personal');
  document.getElementById('tabShared').classList.toggle('active', tab==='shared');
  renderAll();
}

function currentHouseholdFilter(){
  return currentTab === 'shared' ? currentHouseholdId : null;
}

/* ---------- 通用工具 ---------- */
function toggleCategory(id){ document.getElementById(id).classList.toggle('open'); }
function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr);
  return Math.ceil((target - today) / 86400000);
}
function statusTag(days){
  if(days < 0) return '<span class="status-tag status-due">已逾期</span>';
  if(days <= 3) return '<span class="status-tag status-due">即將扣款</span>';
  if(days <= 7) return '<span class="status-tag status-warn">7日內</span>';
  return '<span class="status-tag status-ok">正常</span>';
}

async function renderAll(){
  if(currentTab === 'shared' && !currentHouseholdId){
    document.getElementById('sub-tbody').innerHTML = '';
    document.getElementById('cat-tbody').innerHTML = '';
    document.getElementById('custom-categories-container').innerHTML = '<div class="empty-hint">請先建立或加入家庭群組</div>';
    return;
  }
  await renderSubscriptions();
  await renderCatExpenses();
  await renderCustomCategories();
}

/* ---------- 訂閱 ---------- */
async function renderSubscriptions(){
  const hh = currentHouseholdFilter();
  let query = sb.from('subscriptions').select('*').order('next_date');
  query = hh ? query.eq('household_id', hh) : query.eq('user_id', currentUser.id).is('household_id', null);
  const { data: subs } = await query;

  const tbody = document.getElementById('sub-tbody');
  tbody.innerHTML = '';
  document.getElementById('sub-empty').style.display = (subs && subs.length) ? 'none' : 'block';

  let monthlyTotal = {};
  (subs||[]).forEach(s => {
    const days = daysUntil(s.next_date);
    monthlyTotal[s.currency] = (monthlyTotal[s.currency]||0) + Number(s.amount||0);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input value="${s.name}" onchange="updateSub('${s.id}','name',this.value)"></td>
      <td><input type="number" value="${s.amount}" onchange="updateSub('${s.id}','amount',this.value)"></td>
      <td><select onchange="updateSub('${s.id}','currency',this.value)">${['HKD','CNY','USD'].map(c=>`<option ${c===s.currency?'selected':''}>${c}</option>`).join('')}</select></td>
      <td><select onchange="updateSub('${s.id}','cycle',this.value)">${['每月','每季','每年'].map(c=>`<option ${c===s.cycle?'selected':''}>${c}</option>`).join('')}</select></td>
      <td><input type="date" value="${s.next_date}" onchange="updateSub('${s.id}','next_date',this.value)"></td>
      <td><input value="${(s.reminder_days||[]).join(',')}" onchange="updateSubReminder('${s.id}',this.value)" placeholder="7,30"></td>
      <td>${statusTag(days)}</td>
      <td><button class="icon-btn" onclick="deleteSub('${s.id}')">🗑️</button></td>`;
    tbody.appendChild(tr);
  });

  document.getElementById('sub-summary').innerHTML = Object.entries(monthlyTotal).map(([cur,val]) =>
    `<div class="summary-item">預估月支出 (${cur})<b>${val.toFixed(0)}</b></div>`).join('') || '<div class="summary-item">尚無資料<b>-</b></div>';
  document.getElementById('sub-meta').textContent = `${(subs||[]).length} 項訂閱`;
}
async function updateSub(id, field, val){
  const payload = {}; payload[field] = field==='amount' ? Number(val) : val;
  await sb.from('subscriptions').update(payload).eq('id', id);
  renderSubscriptions();
}
async function updateSubReminder(id, val){
  const arr = val.split(',').map(v=>parseInt(v.trim())).filter(v=>!isNaN(v));
  await sb.from('subscriptions').update({ reminder_days: arr }).eq('id', id);
  renderSubscriptions();
}
async function addSubscription(){
  const hh = currentHouseholdFilter();
  await sb.from('subscriptions').insert({
    user_id: currentUser.id, household_id: hh, name: '新項目', amount: 0, currency: 'HKD',
    cycle: '每月', next_date: new Date().toISOString().slice(0,10), reminder_days: [7]
  });
  renderSubscriptions();
}
async function deleteSub(id){
  if(confirm('確定刪除？')){ await sb.from('subscriptions').delete().eq('id', id); renderSubscriptions(); }
}

/* ---------- 貓咪開支 ---------- */
async function renderCatExpenses(){
  const hh = currentHouseholdFilter();
  let query = sb.from('cat_expenses').select('*').order('date', {ascending:false});
  query = hh ? query.eq('household_id', hh) : query.eq('user_id', currentUser.id).is('household_id', null);
  const { data: exps } = await query;

  const tbody = document.getElementById('cat-tbody');
  tbody.innerHTML = '';
  document.getElementById('cat-empty').style.display = (exps && exps.length) ? 'none' : 'block';

  let total = 0, monthTotal = 0;
  const nowMonth = new Date().toISOString().slice(0,7);
  (exps||[]).forEach(c => {
    total += Number(c.amount||0);
    if(c.date.slice(0,7)===nowMonth) monthTotal += Number(c.amount||0);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="date" value="${c.date}" onchange="updateCat('${c.id}','date',this.value)"></td>
      <td><input value="${c.item}" onchange="updateCat('${c.id}','item',this.value)"></td>
      <td><select onchange="updateCat('${c.id}','category',this.value)">${['飲食','醫療','用品','美容','其他'].map(k=>`<option ${k===c.category?'selected':''}>${k}</option>`).join('')}</select></td>
      <td><input type="number" value="${c.amount}" onchange="updateCat('${c.id}','amount',this.value)"></td>
      <td><input value="${c.note||''}" onchange="updateCat('${c.id}','note',this.value)"></td>
      <td><button class="icon-btn" onclick="deleteCat('${c.id}')">🗑️</button></td>`;
    tbody.appendChild(tr);
  });

  document.getElementById('cat-summary').innerHTML = `
    <div class="summary-item">本月開支<b>HKD ${monthTotal.toFixed(0)}</b></div>
    <div class="summary-item">累計總開支<b>HKD ${total.toFixed(0)}</b></div>`;
  document.getElementById('cat-meta').textContent = `本月 HKD ${monthTotal.toFixed(0)}`;
}
async function updateCat(id, field, val){
  const payload = {}; payload[field] = field==='amount' ? Number(val) : val;
  await sb.from('cat_expenses').update(payload).eq('id', id);
  renderCatExpenses();
}
async function addCatExpense(){
  const hh = currentHouseholdFilter();
  await sb.from('cat_expenses').insert({
    user_id: currentUser.id, household_id: hh, date: new Date().toISOString().slice(0,10),
    item: '新項目', category: '飲食', amount: 0
  });
  renderCatExpenses();
}
async function deleteCat(id){
  if(confirm('確定刪除？')){ await sb.from('cat_expenses').delete().eq('id', id); renderCatExpenses(); }
}

/* ---------- 自訂分類 ---------- */
function openAddCategoryModal(){
  document.getElementById('newCatName').value = '';
  selectedEmoji = '🌱';
  document.querySelectorAll('#emojiPicker span').forEach(el=>el.classList.remove('selected'));
  document.querySelector('#emojiPicker span[data-emoji="🌱"]').classList.add('selected');
  document.getElementById('addCategoryModal').classList.add('show');
}
function closeAddCategoryModal(){ document.getElementById('addCategoryModal').classList.remove('show'); }
document.getElementById('emojiPicker').addEventListener('click', (e)=>{
  if(e.target.tagName === 'SPAN'){
    document.querySelectorAll('#emojiPicker span').forEach(el=>el.classList.remove('selected'));
    e.target.classList.add('selected'); selectedEmoji = e.target.dataset.emoji;
  }
});
async function confirmAddCategory(){
  const name = document.getElementById('newCatName').value.trim();
  if(!name) return alert('請輸入分類名稱');
  const hh = currentHouseholdFilter();
  await sb.from('custom_categories').insert({ user_id: currentUser.id, household_id: hh, name, icon: selectedEmoji });
  closeAddCategoryModal();
  renderCustomCategories();
}
async function deleteCustomCategory(id){
  if(confirm('確定刪除整個分類？')){ await sb.from('custom_categories').delete().eq('id', id); renderCustomCategories(); }
}
async function addCustomRecord(catId){
  await sb.from('custom_records').insert({ category_id: catId, user_id: currentUser.id, date: new Date().toISOString().slice(0,10), item: '新項目', amount: 0 });
  renderCustomCategories();
}
async function updateCustomRecord(id, field, val){
  const payload = {}; payload[field] = field==='amount' ? Number(val) : val;
  await sb.from('custom_records').update(payload).eq('id', id);
  renderCustomCategories();
}
async function deleteCustomRecord(id){
  if(confirm('確定刪除？')){ await sb.from('custom_records').delete().eq('id', id); renderCustomCategories(); }
}
async function renderCustomCategories(){
  const hh = currentHouseholdFilter();
  let catQuery = sb.from('custom_categories').select('*');
  catQuery = hh ? catQuery.eq('household_id', hh) : catQuery.eq('user_id', currentUser.id).is('household_id', null);
  const { data: cats } = await catQuery;

  const container = document.getElementById('custom-categories-container');
  if(!cats || cats.length===0){ container.innerHTML=''; return; }

  let html = '';
  for(const cat of cats){
    const { data: records } = await sb.from('custom_records').select('*').eq('category_id', cat.id).order('date',{ascending:false});
    const total = (records||[]).reduce((s,r)=>s+Number(r.amount||0),0);
    const nowMonth = new Date().toISOString().slice(0,7);
    const monthTotal = (records||[]).filter(r=>r.date.slice(0,7)===nowMonth).reduce((s,r)=>s+Number(r.amount||0),0);
    const rows = (records||[]).map(r => `
      <tr>
        <td><input type="date" value="${r.date}" onchange="updateCustomRecord('${r.id}','date',this.value)"></td>
        <td><input value="${r.item}" onchange="updateCustomRecord('${r.id}','item',this.value)"></td>
        <td><input type="number" value="${r.amount}" onchange="updateCustomRecord('${r.id}','amount',this.value)"></td>
        <td><input value="${r.note||''}" onchange="updateCustomRecord('${r.id}','note',this.value)"></td>
        <td><button class="icon-btn" onclick="deleteCustomRecord('${r.id}')">🗑️</button></td>
      </tr>`).join('');
    html += `
      <div class="category-card" id="custom-${cat.id}">
        <div class="category-header" onclick="toggleCategory('custom-${cat.id}')">
          <div class="category-title"><span class="category-icon">${cat.icon}</span> ${cat.name}</div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="category-meta">${(records||[]).length} 筆記錄</span>
            <button class="icon-btn" onclick="event.stopPropagation();deleteCustomCategory('${cat.id}')">🗑️</button>
            <span class="chevron">▶</span>
          </div>
        </div>
        <div class="category-body"><div class="body-inner">
          <div class="summary-bar">
            <div class="summary-item lav">本月<b>${monthTotal.toFixed(0)}</b></div>
            <div class="summary-item lav">累計<b>${total.toFixed(0)}</b></div>
          </div>
          <button class="add-btn lav" onclick="addCustomRecord('${cat.id}')">➕ 新增記錄</button>
          <table><thead><tr><th>日期</th><th>項目</th><th>金額</th><th>備註</th><th></th></tr></thead>
          <tbody>${rows}</tbody></table>
        </div></div>
      </div>`;
  }
  container.innerHTML = html;
}

/* ---------- 備份 ---------- */
async function exportBackup(){
  const [subs, exps, cats] = await Promise.all([
    sb.from('subscriptions').select('*').eq('user_id', currentUser.id),
    sb.from('cat_expenses').select('*').eq('user_id', currentUser.id),
    sb.from('custom_categories').select('*').eq('user_id', currentUser.id)
  ]);
  const backup = { subscriptions: subs.data, cat_expenses: exps.data, custom_categories: cats.data };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `daily_tasks_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

/* ---------- 初始化：檢查是否已登入 ---------- */
(async () => {
  const { data } = await sb.auth.getSession();
  if(data.session){ onLoginSuccess(data.session.user); }
})();
</script>
